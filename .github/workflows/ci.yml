name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A push and the pull request for the same branch share one group.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  ########################### GNUstep / Linux ###########################
  # Built against the patched stack from gnustep-patches, by that
  # repository's own Scripts/build-gnustep.sh -- the shape ODataStore uses --
  # never a distro GNUstep. The engine needs Foundation and, for its store,
  # FreeCoreData; the designer will add libs-gui and libs-back when it
  # lands. The tests run on every store the engine can use: in memory,
  # SQLite, and FreeCoreData's PostgreSQL and MySQL stores against the
  # servers below.
  gnustep:
    name: Ubuntu (GNUstep, FreeCoreData, clang, gnustep-2.0)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PREFIX: ${{ github.workspace }}/build
      SOURCES: ${{ github.workspace }}/dependencies
      CC: clang
      CXX: clang++
      LIBRARY_COMBO: ng-gnu-gnu
      RUNTIME_VERSION: gnustep-2.0
      COMPONENTS: libobjc2 libdispatch tools-make libs-base tools-xctest
      # libobjc2 and libdispatch land in the prefix's plain lib/, which the
      # gnustep layout does not treat as a library root.
      LD_LIBRARY_PATH: ${{ github.workspace }}/build/lib
      # A commit, not a branch: it decides the recipe hash the stack is
      # cached under. The same pin as ODataStore.
      GNUSTEP_PATCHES_REF: 0211d2cda98a8a71648204e1dd35bc46572b46eb
      # FreeCoreData, pinned to a commit like the stack: #55, which
      # serializes every store round trip (the PostgreSQL store has one
      # connection) and installs the backends' headers where they import,
      # on top of #53's optimistic locking, which the engine's joins rely on.
      FREECOREDATA_REF: 36645cfad092584fd2b6458805a85882f6462852
      # ODataKit, for the OData API (WorkflowKitOData): #3, which leaves
      # what the engine keeps for itself out of what it serves
      # (OData.served NO). Built in its checkout, not installed.
      ODATAKIT_REF: d37586bcf9d28f5ab261dc838a4b6e43f45f0566
      ODATAKIT: ${{ github.workspace }}/ODataKit
    defaults:
      run:
        working-directory: ${{ github.workspace }}/source

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: workflowkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: workflowkit
          MYSQL_DATABASE: workflowkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    steps:
      - uses: actions/checkout@v4
        with:
          path: source

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/gnustep-patches
          ref: ${{ env.GNUSTEP_PATCHES_REF }}
          path: gnustep-patches

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/FreeCoreData
          ref: ${{ env.FREECOREDATA_REF }}
          path: FreeCoreData

      - uses: actions/checkout@v4
        with:
          repository: ashalkhakov/ODataKit
          ref: ${{ env.ODATAKIT_REF }}
          path: ODataKit

      - name: Install packages
        run: |
          ./.github/scripts/apt-update.sh
          sudo apt-get -q -y install \
            pkg-config libgnutls28-dev libffi-dev libicu-dev libxml2-dev libxslt1-dev \
            libssl-dev zlib1g-dev libcurl4-gnutls-dev libsqlite3-dev \
            libpq-dev libmariadb-dev
          # The last three are FreeCoreData's: NSSQLitePersistentStore links
          # libsqlite3, its PostgreSQL store libpq, and its MySQL store
          # MariaDB Connector/C, which speaks to MySQL servers too.
          # The gnustep-2.0 runtime needs ld.gold or lld; ld.gold is gone
          # from binutils on 24.04.
          if [ -x /usr/bin/ld.gold ]; then
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.gold 10
          else
            sudo apt-get -q -y install lld
            sudo update-alternatives --install /usr/bin/ld ld /usr/bin/ld.lld 10
          fi

      - name: GNUstep recipe
        id: recipe
        run: echo "hash=$(../gnustep-patches/Scripts/build-gnustep.sh --print-recipe-hash)" >> "$GITHUB_OUTPUT"

      - name: Restore GNUstep
        id: gnustep-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-${{ steps.recipe.outputs.hash }}

      - name: Build GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        run: ../gnustep-patches/Scripts/build-gnustep.sh

      - name: Save GNUstep
        if: steps.gnustep-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PREFIX }}
          key: gnustep-${{ runner.os }}-${{ steps.recipe.outputs.hash }}

      - name: Verify GNUstep
        if: steps.gnustep-cache.outputs.cache-hit == 'true'
        run: ../gnustep-patches/Scripts/build-gnustep.sh --verify-only

      # The framework, and momc with the coredata-model.make fragment that
      # compiles Model/WorkflowKit.xcdatamodeld. Built after the stack is
      # restored, so it is not part of the cached prefix.
      - name: Build and install FreeCoreData
        working-directory: ${{ github.workspace }}/FreeCoreData
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"
          make install
          make -C Tools/momc
          make -C Tools/momc install
          make -C Backends/PostgreSQL install
          make -C Backends/MySQL install

      # Its libraries only, against FreeCoreData; ODATAKIT (above) names
      # the checkout, so the library build and the tests find them there.
      - name: Build ODataKit
        working-directory: ${{ github.workspace }}/ODataKit
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"

      # On its own, so a compile error is reported as that and not as a
      # test failure. With ODATAKIT set, WorkflowKitOData too.
      - name: Build the library
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make -j"$(nproc)"

      - name: Build the examples
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make examples

      - name: Unit tests
        env:
          WORKFLOWKIT_TEST_POSTGRES_URL: postgresql://postgres:workflowkit@127.0.0.1:5432/postgres
          WORKFLOWKIT_TEST_MYSQL_URL: mysql://root:workflowkit@127.0.0.1:3306/workflowkit
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          make test

      - name: Purchase request demo
        run: |
          . $PREFIX/System/Library/Makefiles/GNUstep.sh
          timeout 120 make -C Examples run
