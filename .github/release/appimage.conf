# WorkflowKit's AppImage: what it carries and starts. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name.
IMAGE=WorkflowKit
NAME=WorkflowKit
# One image, two applications, and the chooser that asks which.
APPS="WorkflowLauncher WorkflowDesk WorkflowDesigner"
# The server is opt-in: nothing in the image serves unless asked so.
TOOLS="wf-serve"
DEFAULT=WorkflowLauncher
#   <image> desk|designer ...          (or a symlink so named)
#   <image> --server -Config server.plist
ROUTES="desk,workflowdesk=WorkflowDesk designer,workflowdesigner=WorkflowDesigner server,--server,wf-serve=wf-serve"
# A process dropped on the image is one to draw, not a question.
WITH_FILE=WorkflowDesigner
ENTRIES="Scripts/appimage/workflowkit.desktop=Apps/WorkflowLauncher/WorkflowLauncher.png Scripts/appimage/workflowdesk.desktop=Apps/WorkflowDesk/WorkflowDesk.png Scripts/appimage/workflowdesigner.desktop=Apps/WorkflowDesigner/WorkflowDesigner.png"
REQUIRE="WorkflowDesk.app/Resources/MainMenu.xib WorkflowDesigner.app/Resources/MainMenu.xib wf-serve"
# On a clean Ubuntu: the chooser, WorkflowDesk and the designer each start
# and stay up.
SMOKE_SCRIPT=Scripts/appimage-smoke.sh
