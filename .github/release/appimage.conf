# WorkflowKit's AppImage: what it carries and starts. The image is
# gnustep-release-actions' appimage (the launcher, the runtime, the fonts),
# the same as every app's; see its appimage.sh for each name. The BPMN and
# DMN editors are UDCode's (UDCodeExtension/, .github/release/udcode.conf).
IMAGE=WorkflowKit
NAME=WorkflowKit
APPS="WorkflowDesk"
# The server is opt-in: nothing in the image serves unless asked so.
TOOLS="wf-serve"
DEFAULT=WorkflowDesk
#   <image> [desk] ...                 (or a symlink so named)
#   <image> --server -Config server.plist
ROUTES="desk,workflowdesk=WorkflowDesk server,--server,wf-serve=wf-serve"
ENTRIES="Scripts/appimage/workflowdesk.desktop=Apps/WorkflowDesk/Resources/WorkflowDesk.png"
REQUIRE="WorkflowDesk.app/Resources/MainMenu.xib wf-serve"
# On a clean Ubuntu: WorkflowDesk starts and stays up.
SMOKE_SCRIPT=Scripts/appimage-smoke.sh
