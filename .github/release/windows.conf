# WorkflowKit's Windows installer: WorkflowDesk, and wf-serve in its
# runtime. The installer is gnustep-release-actions' msi (the runtime,
# WinUXTheme), the same as every app's; see its msi.sh for each name. The
# BPMN and DMN editors are UDCode's (UDCodeExtension/,
# .github/release/udcode.conf).
NAME=WorkflowKit
APPS="WorkflowDesk"
DEFAULT=WorkflowDesk
SUMMARY="Workflows: WorkflowDesk, for a server's tasks and processes, and wf-serve, the server"
# No self-test of its own: started bare WorkflowDesk is still up 25 seconds
# later, its window shown.
ICON=Apps/WorkflowDesk/Resources/WorkflowDesk.png
SMOKE_STAYS_UP=25
