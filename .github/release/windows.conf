# WorkflowKit's Windows installer: WorkflowDesk and WorkflowDesigner, the
# chooser between them, and wf-serve in their runtime. The installer is
# gnustep-release-actions' msi (the runtime, WinUXTheme), the same as every
# app's; see its msi.sh for each name.
NAME=WorkflowKit
APPS="WorkflowLauncher WorkflowDesk WorkflowDesigner"
# The Start menu's shortcut starts the chooser, which asks which app.
DEFAULT=WorkflowLauncher
SUMMARY="Workflows: WorkflowDesk, for a server's tasks and processes, and WorkflowDesigner, for BPMN processes and their forms"
# No self-test of its own: started bare the chooser is still up 25 seconds
# later, its window shown.
SMOKE_STAYS_UP=25
